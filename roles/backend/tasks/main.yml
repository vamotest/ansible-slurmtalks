---
- name: "Install build dependencies for Go"
  ansible.builtin.apt:
    name:
      - build-essential
      - gcc
      - libc6-dev
    state: present

- name: "Download Go binary archive"
  ansible.builtin.get_url:
    url: "https://go.dev/dl/go1.24.0.linux-amd64.tar.gz"
    dest: "/tmp/go1.24.0.linux-amd64.tar.gz"
    mode: "0644"

- name: "Extract Go archive to /usr/local"
  ansible.builtin.unarchive:
    src: "/tmp/go1.24.0.linux-amd64.tar.gz"
    dest: "/usr/local"
    remote_src: true
    creates: "/usr/local/go/bin/go"

- name: "Ensure Go is in system PATH"
  ansible.builtin.lineinfile:
    path: /etc/profile
    line: 'export PATH=$PATH:/usr/local/go/bin'
    state: present

- name: "Clone slurmtalks repository"
  ansible.builtin.git:
    repo: "git@gitlab.slurm.io:edu/devops-cross-project/slurmtalks.git"
    dest: /opt/slurmtalks
    version: main
    force: true
    accept_hostkey: true
  notify: Restart backend

- name: "Deploy backend .env configuration"
  ansible.builtin.template:
    src: env.j2
    dest: /opt/slurmtalks/backend-service/.env
    mode: "0600"
  notify: Restart backend

- name: "Create systemd unit for backend"
  ansible.builtin.template:
    src: backend.service.j2
    dest: /etc/systemd/system/backend.service
    mode: "0644"
  notify: Restart backend

- name: "Ensure backend service is running and enabled"
  ansible.builtin.systemd:
    name: backend
    state: started
    enabled: true
    daemon_reload: true
